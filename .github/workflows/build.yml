name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    name: build and server tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Building also runs the server game tests on a headless dedicated server; a failing test fails the build
      - name: build and server game tests
        shell: bash
        run: ./gradlew build 2>&1 | tee build-output.txt
        timeout-minutes: 20
      # The game tests' verdict and the jar as annotations, readable through the API where the logs cannot be downloaded
      - name: report the game tests and the mod jar
        if: always()
        shell: bash
        run: |
          grep -E "GAME TESTS COMPLETE|required tests? passed|tests? failed|failed with|Test .* failed" build-output.txt | sed 's/^.*\]: //' | tail -10 | while read -r line; do echo "::notice title=Server game tests::$line"; done
          # Which test failed, and why (the game logs each failure with the test's name and its message)
          if grep -qE "required tests? failed|failed at" build-output.txt; then
            grep -E "failed at" build-output.txt | head -12 | sed 's/^.*(Minecraft) //' | cut -c1-900 | while read -r line; do echo "::warning title=Failed game test::$line"; done
          fi
          for jar in build/libs/*.jar; do [ -f "$jar" ] && echo "::notice title=Jar::$(basename "$jar") $(( $(stat -c %s "$jar") / 1024 )) KB"; done
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      # For trying the mod from where artifacts cannot be downloaded: the jar of the latest green push, as the only commit
      # of the ci-jar branch (force-pushed, so it never grows)
      - name: publish the jar to the ci-jar branch
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          tmp=$(mktemp -d)
          for jar in build/libs/*.jar; do case "$jar" in *-sources.jar) ;; *) cp "$jar" "$tmp"/ ;; esac; done
          cd "$tmp"
          git init -q -b ci-jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jar of ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-jar
          echo "::notice title=Jar branch::$(ls *.jar) of ${GITHUB_SHA::7} on the ci-jar branch"
      # For checking vanilla signatures from where the Minecraft jar cannot be downloaded: a commit message with [javap]
      # publishes the members of the classes in .github/javap-classes.txt as the only commit of the ci-javap branch
      - name: publish vanilla signatures to the ci-javap branch
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[javap]')
        shell: bash
        run: |
          jars=$( { find "$HOME/.gradle/caches/fabric-loom" .gradle/loom-cache -name "*.jar" -path "*minecraft*" 2>/dev/null; find "$HOME/.gradle/caches/modules-2" -name "fabric-*.jar" -path "*net.fabricmc.fabric-api*" 2>/dev/null; } | grep -v sources | sort -u)
          cp=$(echo "$jars" | paste -sd: -)
          out=$(mktemp -d)
          echo "$jars" > "$out/jars.txt"
          grep -vE '^\s*(#|$)' .github/javap-classes.txt | while read -r name; do
            if [[ "$name" != *.* ]]; then
              found=$(for j in $jars; do unzip -Z1 "$j" 2>/dev/null; done | grep -E "(^|/)${name}\.class$" | sed 's/\.class$//; s#/#.#g' | sort -u || true)
              [ -z "$found" ] && { echo "NOT FOUND: $name" >> "$out/javap.txt"; continue; }
            else
              found="$name"
            fi
            for cls in $found; do
              echo "=== $cls" >> "$out/javap.txt"
              javap -p -cp "$cp" "$cls" >> "$out/javap.txt" 2>&1 || echo "NOT FOUND: $cls" >> "$out/javap.txt"
            done
          done
          # Data files out of the jars too (recipe formats and the like): one zip glob per line of .github/javap-files.txt
          if [ -f .github/javap-files.txt ]; then
            grep -vE '^\s*(#|$)' .github/javap-files.txt | while read -r pattern; do
              for j in $jars; do
                for entry in $(unzip -Z1 "$j" "$pattern" 2>/dev/null | head -8 || true); do
                  echo "=== FILE $entry" >> "$out/files.txt"
                  unzip -p "$j" "$entry" >> "$out/files.txt" 2>/dev/null || true
                  echo >> "$out/files.txt"
                done
              done
            done
          fi
          cd "$out"
          git init -q -b ci-javap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Signatures for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-javap
          echo "::notice title=Signatures::$(grep -c '^=== ' javap.txt) classes, $(grep -c '^NOT FOUND' javap.txt) not found, on the ci-javap branch"

  client:
    name: client test and screenshots
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libegl1
      - name: client game test
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --no-configuration-cache 2>&1 | tee client-output.txt
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        timeout-minutes: 25
      # Why a client test failed, readable through the API where the logs cannot be downloaded
      - name: report a failed client test
        if: failure()
        shell: bash
        run: |
          { grep -E "Exception|Error:|error:|ERROR\\]|AssertionError|Caused by|at com\\.extremeprogression" client-output.txt || true; } | grep -vE "server.properties|MalformedJson|Realms|flite|narrator|Anisotropic|GLX|OpenGL" | head -12 | cut -c1-900 | while read -r line; do echo "::warning title=Client test::$line"; done || true
      # For reviewing from where artifacts cannot be downloaded: the latest screenshots of a push, as the only commit of
      # the ci-screenshots branch (force-pushed, so it never grows)
      - name: publish the screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          dir="$PWD/build/run/clientGameTest/screenshots"
          ls "$dir"/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          tmp=$(mktemp -d)
          cp "$dir"/*.png "$tmp"/
          cd "$tmp"
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
          echo "::notice title=Screenshots::$(ls *.png | wc -l) screenshots of ${GITHUB_SHA::7} on the ci-screenshots branch"
      - name: capture screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Screenshots
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: warn
      # For reviewing from where artifacts cannot be downloaded: a commit message with [shots] prints the screenshots
      # into the log as small JPEGs (base64, one IMG| line per chunk)
      - name: screenshots in the log
        if: always() && contains(github.event.head_commit.message, '[shots]')
        run: |
          python3 -m pip install -q --break-system-packages pillow >/dev/null 2>&1 || pip install -q pillow
          python3 - <<'PY'
          import glob, base64, io, os
          from PIL import Image
          for f in sorted(glob.glob("build/run/clientGameTest/screenshots/*.png")):
              im = Image.open(f).convert("RGB")
              im.thumbnail((800, 450))
              b = io.BytesIO(); im.save(b, "JPEG", quality=72)
              s = base64.b64encode(b.getvalue()).decode()
              for i in range(0, len(s), 3000):
                  print(f"IMG|{os.path.basename(f)}|{i//3000}|{s[i:i+3000]}")
          PY

  # The compatibility run: the server game tests and the client test with Extreme Dimensions (its latest release, or
  # built from its source when it has none) and the newest Sodium, Iris and Mod Menu for this game version from Modrinth
  compat:
    name: compatibility run with Extreme Dimensions, Sodium, Iris and Mod Menu
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Sodium and Iris draw with OpenGL (the game alone falls back to Vulkan): the display needs GLX, in software
      - name: virtual display with OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 mesa-utils mesa-vulkan-drivers
      - name: fetch Extreme Dimensions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/compat-mods
          if gh release download --repo Peertjeh/extremedimensions --pattern 'extremedimensions-*.jar' --dir build/compat-mods; then
            rm -f build/compat-mods/*-sources.jar
            echo "::notice title=Compat::$(ls build/compat-mods | tr '\n' ' ')from Extreme Dimensions' latest release"
          else
            git clone -q --depth 1 https://github.com/Peertjeh/extremedimensions "$RUNNER_TEMP/ed"
            (cd "$RUNNER_TEMP/ed" && chmod +x gradlew && ./gradlew -q assemble)
            cp $(ls "$RUNNER_TEMP"/ed/build/libs/extremedimensions-*.jar | grep -v sources) build/compat-mods/
            echo "::notice title=Compat::$(ls build/compat-mods | tr '\n' ' ')built from Extreme Dimensions' source"
          fi
      - name: fetch Sodium, Iris and Mod Menu
        shell: bash
        run: |
          set +e
          python3 tools/compat/fetch.py build/compat-mods | tee fetch.txt
          grep '^COMPAT|' fetch.txt | while IFS='|' read -r _ slug ver what; do echo "::notice title=Compat::$slug $ver $what"; done
          exit 0
      - name: server game tests with them
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTest -Pcompat --no-configuration-cache 2>&1 | tee compat-server.txt
        timeout-minutes: 20
      - name: client game test with them
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClientGameTest --no-configuration-cache -Pcompat 2>&1 | tee compat-client.txt
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.6'
          # (the virtual display has no GLX visual of the kind the game asks for; through EGL Mesa makes one)
          SDL_VIDEO_FORCE_EGL: '1'
          SDL_VIDEO_X11_FORCE_EGL: '1'
        timeout-minutes: 25
      - name: report the compatibility run
        if: always()
        shell: bash
        run: |
          for f in compat-server.txt compat-client.txt; do
            [ -f "$f" ] || continue
            grep -E "GAME TESTS COMPLETE|required tests? passed|tests? failed" "$f" | sed 's/^.*\]: //' | tail -3 | while read -r line; do echo "::notice title=Compat $f::$line"; done
            { grep -E "failed at|AssertionError|Caused by|Incompatible mod|Mixin apply failed|Exception|FAILURE|What went wrong" "$f" || true; } | grep -v MalformedJson | head -12 | cut -c1-900 | while read -r line; do echo "::warning title=Compat $f::$line"; done
          done
          # (and the client run's last lines, whatever ended it)
          [ -f compat-client.txt ] && tail -15 compat-client.txt | cut -c1-500 | while read -r line; do echo "::notice title=Compat client tail::$line"; done || true
      - name: publish the screenshots to the ci-compat-screenshots branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          dir="$PWD/build/run/clientGameTest/screenshots"
          ls "$dir"/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          tmp=$(mktemp -d)
          cp "$dir"/*.png "$tmp"/
          cd "$tmp"
          git init -q -b ci-compat-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Compatibility screenshots of ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-compat-screenshots

  # A version not released yet goes out by itself (as Extreme Dimensions does): once the build, the client test and the
  # compatibility run pass on a push to the default branch or develop, the jar is released as v<version> (the version in
  # gradle.properties), with that version's part of CHANGELOG.md as its notes. With a MODRINTH_TOKEN secret and a
  # MODRINTH_PROJECT variable in the repository's settings, the same jar goes to Modrinth. A version already released is
  # left alone.
  release:
    name: release a new version
    needs: [build, client, compat]
    if: github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'develop')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: release this version if it is new
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" -n Artifacts -D dist
          jar="dist/extremeprogression-$version.jar"
          [ -f "$jar" ] || { echo "no $jar among the build's artifacts:"; ls dist; exit 1; }
          name=$(sed -n "s/^## $version: //p" CHANGELOG.md | head -1)
          { echo "Minecraft $mc · Fabric · Java 25"; echo; awk -v v="## $version:" 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md; } > notes.md
          gh release create "v$version" "$jar" --target "$GITHUB_SHA" --title "Extreme Progression $version${name:+ — $name}" --notes-file notes.md
          echo "::notice title=Release::v$version released on GitHub"
          { echo "new=true"; echo "version=$version"; echo "mc=$mc"; echo "jar=$jar"; echo "name=$name"; } >> "$GITHUB_OUTPUT"
      - name: publish it to Modrinth
        if: steps.release.outputs.new == 'true' && env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          data = {
              "name": "Extreme Progression " + os.environ["VERSION"] + (" — " + os.environ["NAME"] if os.environ["NAME"] else ""),
              "version_number": os.environ["VERSION"],
              "changelog": open("notes.md", encoding="utf-8").read(),
              "dependencies": [{"project_id": "P7dR8mSH", "dependency_type": "required"}],
              "game_versions": [os.environ["MC"]],
              "version_type": "release",
              "loaders": ["fabric"],
              "featured": True,
              "project_id": os.environ["MODRINTH_PROJECT"],
              "file_parts": ["file"],
              "primary_file": "file",
          }
          open("modrinth.json", "w", encoding="utf-8").write(json.dumps(data))
          PY
          code=$(curl -s -o modrinth-answer.txt -w '%{http_code}' -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: Peertjeh/In-Game-MMO release" \
            -F "data=@modrinth.json;type=application/json" -F "file=@$JAR")
          echo "::notice title=Modrinth::HTTP $code $(head -c 300 modrinth-answer.txt)"
          [ "$code" = 200 ]
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MC: ${{ steps.release.outputs.mc }}
          JAR: ${{ steps.release.outputs.jar }}
          NAME: ${{ steps.release.outputs.name }}
